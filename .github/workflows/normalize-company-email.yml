name: Normalize company email

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Replace company email everywhere
        run: node scripts/replace-company-email.mjs

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No company email changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use official Bahari Asili Safaris email everywhere"
          git push
