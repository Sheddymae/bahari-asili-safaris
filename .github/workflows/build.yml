name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: ESLint
        run: npm run lint

      - name: SEO configuration check
        run: npm run check:seo

      - name: Content completeness report
        run: npm run check:content

      - name: TypeScript check
        run: npm run typecheck

      - name: Translation fallback check
        run: npm run check:i18n -- --changed

      - name: WCAG brand contrast check
        run: npm run check:contrast

      - name: Production build
        run: npm run build
